name: Manual legacy validation (daily owner is local launchd v2)
# No scheduled state owner: the durable v2 collector runs through launchd.
# workflow_dispatch remains a manual legacy regression check, not a pilot run.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-signals
  cancel-in-progress: false
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline regression suite
        run: python -m pytest tests/ -q
      - name: Bootstrap from clean artifacts and exercise local fills
        run: python scripts/local_sandbox.py --output data/ci-sandbox --capital 10000
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/parquet/
            data/models/
          key: causal-models-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: causal-models-v2-${{ runner.os }}-
      - name: Bootstrap missing versioned market model bundles
        run: python scripts/bootstrap_models.py
      - name: Validate fresh signals (no orders or alerts)
        run: python live.py run --dry-run
      - name: Local operational inventory
        if: always()
        run: python scripts/operational_status.py > operational-status.json
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            data/parquet/
            data/models/
          key: causal-models-v2-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-validation-${{ github.run_id }}
          path: |
            data/ci-sandbox/
            operational-status.json
          retention-days: 90
